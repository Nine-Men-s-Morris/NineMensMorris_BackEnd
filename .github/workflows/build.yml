name: build

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # -x test 를 붙이지 않음. 테스트를 건너뛰는 빌드는 CI 로서 의미가 없음
      - run: ./gradlew build --no-daemon
